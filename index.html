<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123c35">
  <title>McLeodganj & Triund Trek | The Explorer</title>
  <meta name="description"
    content="Explore McLeodganj and trek to Triund Top on a guided five-day trip with transport, stays and meals.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header">
    <a class="brand" href="#home" aria-label="The Explorer home">
      <span class="brand-mark" aria-hidden="true">▲</span>
      <span><strong id="brandName"></strong><small id="brandTagline"></small></span>
    </a>
    <nav id="mainNav" aria-label="Main navigation">
      <a id="navItinerary" href="#itinerary"></a>
      <a id="navPackage" href="#package"></a>
      <a class="nav-cta" href="#contact"><span id="navContact"></span><span aria-hidden="true">↗</span></a>
    </nav>
  </header>

  <main>
    <section class="hero" id="home">
      <div class="hero-copy">
        <p class="eyebrow"><span class="eyebrow-dot"></span><span id="heroEyebrow"></span></p>
        <h1 id="heroTitle"></h1>
        <p class="hero-description" id="heroDescription"></p>
        <div class="hero-actions">
          <a class="button button-light" href="#itinerary"><span id="heroItineraryCta"></span><span
              aria-hidden="true">↓</span></a>
          <a class="text-link" id="heroCall"></a>
        </div>
        <div class="hero-facts" id="heroFacts"></div>
      </div>
      <figure class="hero-art">
        <img id="heroImage" alt="" fetchpriority="high">
        <figcaption id="heroImageCaption"></figcaption>
      </figure>
      <div class="hero-bottom" aria-hidden="true"><span id="heroLocation"></span><span id="heroCoordinates"></span>
      </div>
    </section>

    <section class="intro section-wrap" aria-labelledby="introTitle">
      <div>
        <p class="eyebrow eyebrow-dark" id="introEyebrow"></p>
        <h2 id="introTitle"></h2>
      </div>
      <p class="intro-copy" id="introCopy"></p>
    </section>

    <section class="itinerary-section" id="itinerary">
      <div class="section-wrap">
        <div class="section-heading">
          <div>
            <p class="eyebrow eyebrow-dark" id="itineraryEyebrow"></p>
            <h2 id="itineraryTitle"></h2>
          </div>
          <p id="itineraryDescription"></p>
        </div>
        <div class="itinerary-layout">
          <ol class="itinerary-list" id="itineraryList"></ol>
          <figure class="itinerary-art">
            <img id="itineraryImage" alt="" loading="lazy">
            <figcaption id="itineraryImageCaption"></figcaption>
          </figure>
        </div>
      </div>
    </section>

    <section class="package-section section-wrap" id="package">
      <div class="package-copy">
        <p class="eyebrow eyebrow-dark" id="packageEyebrow"></p>
        <h2 id="packageTitle"></h2>
        <p class="package-description" id="packageDescription"></p>
        <h3 id="inclusionsTitle"></h3>
        <ul class="inclusions" id="inclusions"></ul>
        <p class="availability-note" id="availabilityNote"></p>
      </div>
      <aside class="price-card">
        <p class="offer-label" id="offerLabel"></p>
        <p class="price" id="packagePrice"></p>
        <p class="price-caption" id="priceCaption"></p>
        <div class="booking-amount">
          <span class="booking-icon" aria-hidden="true">↗</span>
          <span><small id="bookingLabel"></small><strong id="bookingAmount"></strong></span>
        </div>
        <h3 id="departuresTitle"></h3>
        <ul class="departure-list" id="departureDates"></ul>
        <a class="button button-dark" id="packageCta"></a>
        <p class="card-footnote" id="priceDisclaimer"></p>
      </aside>
    </section>

    <section class="contact-section" id="contact">
      <div class="section-wrap contact-inner">
        <div>
          <p class="eyebrow" id="contactEyebrow"></p>
          <h2 id="contactTitle"></h2>
          <p id="contactDescription"></p>
        </div>
        <div class="contact-actions">
          <a class="button button-light" id="whatsappLink"></a>
          <a class="contact-email" id="emailLink"></a>
          <p id="contactHours"></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <a class="brand brand-footer" href="#home"><span class="brand-mark" aria-hidden="true">▲</span><span><strong
          id="footerBrand"></strong><small id="footerTagline"></small></span></a>
    <p id="footerNote"></p>
    <p>© <span id="year"></span> <span id="copyrightBrand"></span></p>
  </footer>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>

</html>
